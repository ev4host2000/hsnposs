name: mizapos_mobile
version: 1.0.37+38
description: MizaPos — واجهة الجوال (Android).

publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.0.0
  get: ^4.0.0
  path: ^1.9.0
  path_provider: ^2.1.5
  intl: ^0.20.2
  pdf: ^3.6.0
  uuid: ^4.5.1
  printing: ^5.14.3
  excel: ^4.0.6
  share_plus: ^13.1.0
  bcrypt: ^1.2.0
  file_selector: ^1.0.3
  package_info_plus: ^10.1.0
  url_launcher: ^6.3.2
  mailer: ^7.1.0
  http: ^1.3.0
  flutter_local_notifications: ^21.0.0
  shared_preferences: ^2.5.5
  pub_semver: ^2.2.0
  mobile_scanner: ^7.2.0
  open_file: ^3.5.11
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: ../../assets/branding/mizapos_logo_symbol_clean.png
  adaptive_icon_background: "#0B1628"
  adaptive_icon_foreground: ../../assets/branding/mizapos_logo_symbol_clean.png
  android: true

flutter:
  uses-material-design: true
  assets:
    - ../../assets/branding/mizapos_logo.png
    - ../../assets/branding/mizapos_logo_symbol_clean.png
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/fonts/NotoSansArabic-Bold.ttf
