<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#00407B" />
  <meta name="description" content="اتصل بـ MizaPos — استفسار، تفعيل، دعم فني، أو طلب الباقة." />
  <title>اتصل بنا — MizaPos</title>
  <link rel="icon" href="assets/branding/mizapos_app_icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="sub-page">
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar" id="site-header" data-active="contact"></header>

  <main class="sub-main">
    <div class="wrap narrow">
      <p class="page-eyebrow">تواصل معنا</p>
      <h1 class="page-title">اتصل بنا</h1>
      <p class="page-lead">للاستفسار، التفعيل، طلب الباقة، أو الوكالة — أرسل رسالة أو راسلنا على واتساب. نرد في أقرب وقت.</p>

      <div class="page-card contact-page-card">
        <form id="contact-form" class="contact-form" novalidate>
          <input type="text" name="company" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <label class="field-label" for="cf-topic">الموضوع</label>
          <select id="cf-topic" name="topic" class="field-input">
            <option value="استفسار عام">استفسار عام</option>
            <option value="باقة 70 دولار (كمبيوتر + جوال)">باقة 70 دولار (كمبيوتر + جوال)</option>
            <option value="طلب تفعيل / قسيمة">طلب تفعيل / قسيمة</option>
            <option value="خدمات البرمجة والتطوير">خدمات البرمجة والتطوير</option>
            <option value="استضافة مواقع الويب">استضافة مواقع الويب</option>
            <option value="الوكالة والتوزيع">الوكالة والتوزيع</option>
            <option value="دعم فني">دعم فني</option>
          </select>
          <label class="field-label" for="cf-name">الاسم</label>
          <input id="cf-name" name="name" class="field-input" type="text" required autocomplete="name" />
          <label class="field-label" for="cf-email">البريد الإلكتروني</label>
          <input id="cf-email" name="email" class="field-input" type="email" required dir="ltr" autocomplete="email" />
          <label class="field-label" for="cf-phone">الهاتف (اختياري)</label>
          <input id="cf-phone" name="phone" class="field-input" type="tel" dir="ltr" autocomplete="tel" />
          <label class="field-label" for="cf-message">الرسالة</label>
          <textarea id="cf-message" name="message" class="field-input field-textarea" rows="5" required></textarea>
          <p id="contact-form-status" class="form-status" role="status"></p>
          <button type="submit" class="btn btn-primary btn-block" id="contact-form-submit">إرسال الرسالة</button>
        </form>

        <div class="contact-page-aside">
          <a class="btn btn-wa btn-block" href="#" data-wa-link>مراسلة واتساب</a>
          <div class="contact-social">
            <h2>تابعنا على وسائل التواصل</h2>
            <nav class="footer-social" aria-label="حسابات MizaPos">
              <a href="https://www.facebook.com/MizaPos" target="_blank" rel="noopener noreferrer">فيسبوك</a>
              <a href="https://www.instagram.com/mizapos" target="_blank" rel="noopener noreferrer">إنستقرام</a>
              <a href="https://www.tiktok.com/@mizapos" target="_blank" rel="noopener noreferrer">تيك توك</a>
            </nav>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <img src="assets/branding/mizapos_logo.png" width="100" height="100" alt="MizaPos" class="footer-logo" loading="lazy" />
      <p>© <span id="y"></span> <strong>MizaPos</strong></p>
      <p class="footer-legal">
        <a href="index.html">الرئيسية</a>
        <span aria-hidden="true"> · </span>
        <a href="terms-of-use.html">شروط الاستخدام</a>
        <span aria-hidden="true"> · </span>
        <a href="privacy-policy.html">سياسة الخصوصية</a>
      </p>
    </div>
  </footer>

  <a class="wa-float" href="#" data-wa-link title="واتساب" aria-label="واتساب">

  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
  <script src="site-config.js" defer></script>
  <script src="site-shell.js" defer></script>
  <script src="site-contact.js" defer></script>
</body>
</html>
