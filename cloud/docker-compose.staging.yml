# Miza Cloud — staging stack (api-staging.mizapos.com)
# Usage:
#   cp .env.staging.example .env.staging
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
#
# TLS: mount Let's Encrypt certs to deploy/ssl/ or use certbot profile below.

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
      - ./api/database:/schema:ro
      - ./deploy/docker-init/00-install.sh:/docker-entrypoint-initdb.d/00-install.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - miza_staging

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.staging
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - api_logs:/var/www/html/storage/logs
      - api_rate_limit:/var/www/html/storage/rate_limit
      - api_media:/var/www/html/storage/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - miza_staging

  nginx:
    image: nginx:1.27-alpine
    restart: always
    environment:
      ADMIN_SECURITY_MODE: "${ADMIN_SECURITY_MODE:-strict}"
      ADMIN_ALLOWED_IPS: "${ADMIN_ALLOWED_IPS:-}"
    entrypoint: ["/bin/sh", "/opt/mizapos/nginx-strict-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./api:/var/www/html:ro
      - ./admin/public:/var/www/admin:ro
      - ./owner/public:/var/www/owner:ro
      - api_media:/media_store:ro
      - ./deploy/nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/nginx-strict-entrypoint.sh:/opt/mizapos/nginx-strict-entrypoint.sh:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - miza_staging

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    volumes:
      - ./deploy/ssl:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  backup:
    image: postgres:15-alpine
    profiles:
      - backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./deploy/backups:/backups
      - ./deploy/scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "chmod +x /backup.sh && while true; do /backup.sh; sleep 86400; done"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - miza_staging

volumes:
  pgdata_staging:
  api_logs:
  api_rate_limit:
  api_media:
  certbot_www:

networks:
  miza_staging:
    driver: bridge
