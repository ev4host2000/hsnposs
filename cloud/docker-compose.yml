# Miza Cloud — local development stack
# Usage: docker compose up -d  (from cloud/)
# API:   http://127.0.0.1:8787/v1/health

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mizacloud}
      POSTGRES_USER: ${DB_USER:-mizacloud}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mizacloud_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/database:/schema:ro
      - ./deploy/docker-init/00-install.sh:/docker-entrypoint-initdb.d/00-install.sh:ro
      - ./api/src/Modules/Auth/database/dev_seed.sql:/docker-entrypoint-initdb.d/99-dev_seed.sql:ro
    ports:
      - "${DB_PORT_PUBLISH:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mizacloud} -d ${DB_NAME:-mizacloud}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://127.0.0.1:8787}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mizacloud}
      DB_USER: ${DB_USER:-mizacloud}
      DB_PASSWORD: ${DB_PASSWORD:-mizacloud_dev}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-2592000}
      JWT_ISSUER: ${JWT_ISSUER:-api.mizapos.com}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-20}
      RATE_LIMIT_LOGIN_WINDOW: ${RATE_LIMIT_LOGIN_WINDOW:-60}
    volumes:
      - ./api:/var/www/html
      - api_media:/var/www/html/storage/media
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8787}:80"
    volumes:
      - ./api:/var/www/html:ro
      - api_media:/media_store:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
  api_media:
