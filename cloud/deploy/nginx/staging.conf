# Staging / production nginx — HTTP redirect + HTTPS termination
# TLS certs: deploy/ssl/live/api.mizapos.com/fullchain.pem + privkey.pem

server {
    listen 80;
    server_name api.mizapos.com api-staging.mizapos.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.mizapos.com api-staging.mizapos.com;

    ssl_certificate     /etc/nginx/ssl/live/api.mizapos.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/api.mizapos.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 16M;

    location /media/ {
        alias /media_store/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /admin/ {
        include /etc/nginx/admin-allowlist.conf;
        alias /var/www/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location /owner/ {
        alias /var/www/owner/;
        index index.html;
        try_files $uri $uri/ /owner/index.html;
    }

    location ^~ /v1/admin/ {
        include /etc/nginx/admin-allowlist.conf;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /v1/owner/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /v1/public/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass api:9000;
        fastcgi_read_timeout 120s;
    }

    location ~ /\. {
        deny all;
    }
}
